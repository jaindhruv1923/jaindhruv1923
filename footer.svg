        M0,30 C150,10 300,50 450,20 C600,50 750,10 900,40 C1050,10 1150,50 1200,30 L1200,0 L0,0 Z;
        M0,30 C150,0 300,60 450,30 C600,0 750,60 900,30 C1050,0 1150,20 1200,30 L1200,0 L0,0 Z
      "/>
  </path>
</svg>
